# Codex Project Configuration
# Scoped to this repository — controls MCP servers, agents, and project behavior

# --- MCP Servers ---
# These give Codex access to external tools and context relevant to this stack

# GitHub MCP Server (Remote Streamable HTTP — official from GitHub)
# Requires: export GITHUB_PAT_TOKEN=ghp_... in your environment
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"

# Context7 — up-to-date developer docs (Cloudflare, MCP SDK, frameworks)
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

# Cloudflare Workers Bindings — manage Workers, KV, and bindings
[mcp_servers.cloudflare_bindings]
url = "https://bindings.mcp.cloudflare.com/mcp"

# Cloudflare Observability — debug logs and analytics
[mcp_servers.cloudflare_observability]
url = "https://observability.mcp.cloudflare.com/mcp"

# Playwright — browser automation and testing
[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp"]

# --- Agent Configuration ---
[agents]
max_threads = 6
max_depth = 1
